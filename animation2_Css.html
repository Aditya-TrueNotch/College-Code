<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div{
            width: 300px;
            height: 300px;
            background-color:red ;
            position: relative;
            animation-name: fah;
            animation-duration: 1.5s;

        }
        @keyframes fah{
            0% {background-color: red; left:0px; top:0px;}
            25%{background-color: rgb(186, 255, 24); left:200px; top:0px;}
            50%{background-color: rgb(75, 255, 69); left:200px; top:200px;}
            75%{background-color: rgb(0, 89, 255); left:0px; top:200px;}
            100%{background-color: rgb(255, 0, 255); left:0px; top:0px;}

        }
</style>
<body>
   <div></div> 
</body>
</html>
