<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSITION MULTIPLE CSS</title>
    <style>
        div{
            border-radius:20px;
            width:100px;
            height: 100px;
            background-color: red;
            transition: width 2s, height 2s, background-color 2s,transform 2s;
        }
        div:hover{
            width: 300px;
            height:300px;
            background-color: orange;
            transform: rotate(1600deg);
        }
    </style>

</head>
<body>
    <div>hello world</div>
</body>
</html>
