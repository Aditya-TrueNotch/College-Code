<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIMATION CSS</title>
    <style>
        div{
            width: 300px;
            height: 300px;
            background-color:red ;
            animation-name: fah;
            animation-duration: 1s;

        }
        @keyframes fah{
            from {background-color:red; }
            to {background-color:orange;}
        }
    </style>
</head>
<body>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Totam voluptatum quisquam voluptates?</p>
    <div> </div>
</body>
</html>
