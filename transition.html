<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition Property CSS</title>
    <STYLe> 
        div{
            
            border-radius: 55px;
            width: 100px;
            height: 100px;
            background-color: greenyellow;
            transition:width 1.5s cubic-bezier();
            
        }
        div:hover{
            width: 300px;

        }

    </STYLe>
</head>
<body>
    <h1>Transition</h1>
    <p>Transition Property</p>
    <div style="text-align: center;">wow</div>
</body>
</html>
